<g opacity="0"><text x="400" y="250" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">platform clock: a crest every 2.5 T  ×  train clock runs at 0.8  =  every 2 T on the train clock</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.62" values="0;1"/></g>
<g opacity="1"><text x="400" y="282" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">① The lamp sends one crest per period T; each crest spreads out at c</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.21" values="1;0"/></g>
<g opacity="0"><text x="400" y="282" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">② The train runs away from the crests, so they reach it only every 2.5 T (platform time)</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.21;0.62" values="0;1;0"/></g>
<g opacity="0"><text x="400" y="282" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal">③ Measured on the train's own clock that is 2 T: the frequency is halved, ν' = ν/2</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.62" values="0;1"/></g></svg>
