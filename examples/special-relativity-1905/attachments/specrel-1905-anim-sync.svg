<g opacity="0"><text x="110" y="62" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="normal">sent: t_A = 0</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05" values="0;1"/></g>
<g opacity="0"><text x="650" y="62" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="normal">reflected: t_B = 1 ms</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35" values="0;1"/></g>
<g opacity="0"><text x="110" y="202" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="normal">back: t'_A = 2 ms</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.65" values="0;1"/></g>
<g opacity="0"><text x="380" y="232" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="bold">t_B − t_A = 1 ms  =  t'_A − t_B = 1 ms   →   the clocks are synchronous</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.65" values="0;1"/></g>
<g opacity="1"><text x="380" y="282" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">① A sends a light signal towards B at A-time 0</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35" values="1;0"/></g>
<g opacity="0"><text x="380" y="282" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">② B reflects it; B's clock must read halfway between sending and return</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35;0.65" values="0;1;0"/></g>
<g opacity="0"><text x="380" y="282" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">③ Back at A at 2 ms: the trip out equals the trip back, by definition</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.65" values="0;1"/></g></svg>
